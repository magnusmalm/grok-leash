[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grok-leash"
version = "0.1.0"
description = "Real-time monitoring and safety guard for Grok subagents (prevents runaway tool loops)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    { name = "Magnus Malm", email = "magnusmalm@protonmail.com" }
]
dependencies = [
    "rich>=13.0.0",
    "watchdog>=4.0.0",   # for efficient file watching
]

[project.scripts]
grok-leash = "grok_leash.cli:main"
grok-runaway-monitor = "grok_leash.monitor:cli_main"
grok-leash-watch-actions = "grok_leash.actions_watcher:cli_watch_actions"
grok-leash-check-alerts = "grok_leash.alerts:cli_check_alerts"
grok-leash-acknowledge = "grok_leash.alerts:cli_acknowledge"

[project.urls]
Homepage = "https://github.com/magnusmalm/grok-leash"
Repository = "https://github.com/magnusmalm/grok-leash"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_leash"]

[tool.uv]
managed = true
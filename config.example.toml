# Example configuration for grok-leash
# Copy to ~/.config/grok-leash/config.toml and customize

[monitor]
read_threshold = 30
time_window_minutes = 6
small_limit_threshold = 80

[actions]
enable_desktop_notifications = true
enable_kill_action = false          # DANGER: experimental
write_action_file = true
notify_parent_via_file = true

[detection]
warn_on_missing_budget = true

[hook]
# Hard limit on how many times the same file can be read via read_file
# in a single session. The counter resets if the file is modified.
read_file_hard_cap = 42

# When the read count for a file exceeds this number, a warning is printed
# to stderr (visible in the agent's output). Defaults to hard_cap / 2.
read_file_warning_threshold = 21